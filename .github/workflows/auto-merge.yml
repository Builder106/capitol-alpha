name: Auto-Merge

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions: {}

jobs:
  dependabot:
    if: |
      !github.event.pull_request.draft &&
      github.event.pull_request.user.login == 'dependabot[bot]' &&
      github.event.pull_request.base.ref == github.event.repository.default_branch &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: dependabot/fetch-metadata@v3
        id: metadata
        with:
          github-token: ${{ github.token }}
      - name: Enable auto-merge for Dependabot
        if: |
          steps.metadata.outputs.update-type == 'version-update:semver-patch' ||
          steps.metadata.outputs.update-type == 'version-update:semver-minor'
        run: |
          output=$(gh pr merge --auto --squash --delete-branch "$PR_URL" 2>&1) || {
            case "$output" in
              *"already in progress"*|*"already auto-merged"*|*"already merged"*|*"already queued"*|*"already set"*|*"not open"*|*"draft"*)
                echo "Auto-merge already handled: $output"
                exit 0
                ;;
              *)
                echo "::error::$output"
                exit 1
                ;;
            esac
          }
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ github.token }}

  owner:
    if: |
      !github.event.pull_request.draft &&
      (github.event.pull_request.user.login == 'Builder106' || github.event.pull_request.user.login == github.repository_owner) &&
      github.event.pull_request.base.ref == github.event.repository.default_branch &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Enable auto-merge for Owner
        run: |
          output=$(gh pr merge --auto --squash --delete-branch "$PR_URL" 2>&1) || {
            case "$output" in
              *"already in progress"*|*"already auto-merged"*|*"already merged"*|*"already queued"*|*"already set"*|*"not open"*|*"draft"*)
                echo "Auto-merge already handled: $output"
                exit 0
                ;;
              *)
                echo "::error::$output"
                exit 1
                ;;
            esac
          }
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ github.token }}
