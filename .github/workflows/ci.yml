name: CI

on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    name: Secret scan
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_NOTIFY_USER_LIST: ""

  test:
    name: Syntax + unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen --group dev

      - name: Python dependency audit
        run: uv run --with pip-audit pip-audit

      - name: License compliance check
        run: uv run --with pip-licenses pip-licenses --fail-on="AGPL;GPL"

      - name: Lint with Ruff
        run: uv run --with ruff ruff check pipeline tests run_pipeline.py

      - name: Format check with Ruff
        run: uv run --with ruff ruff format --check pipeline tests run_pipeline.py || true

      - name: Type check (pyright)
        run: uv run --with pyright pyright

      - name: Syntax check
        run: uv run --frozen python -m compileall -q pipeline tests utils run_pipeline.py

      - name: Unit tests with coverage
        env:
          PYTHONWARNINGS: "error"
        run: uv run --frozen pytest -v -W error

  playwright:
    name: E2E tests (Playwright BDD)
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm

      - name: Install deps from lockfile
        run: npm ci --no-audit --no-fund

      - name: Node dependency audit
        run: |
          for i in 1 2 3; do
            npm audit --audit-level=high && exit 0 || true
            echo "npm audit failed or timed out (attempt $i/3), retrying in 5s..."
            sleep 5
          done
          npm audit --audit-level=high

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Generate Gherkin specs
        run: npx bddgen

      - name: Run Playwright
        run: npx playwright test

      - name: Upload Playwright artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  deploy:
    name: Trigger Vercel deploy
    needs: [secrets, playwright]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/staging')
    runs-on: ubuntu-24.04
    steps:
      - name: Trigger staging deploy hook
        if: github.ref == 'refs/heads/staging'
        env:
          HOOK_URL: ${{ secrets.VERCEL_DEPLOY_HOOK_STAGING }}
        run: |
          if [ -z "$HOOK_URL" ]; then
            echo "::notice::VERCEL_DEPLOY_HOOK_STAGING is not set; skipping deployment"
            exit 0
          fi
          curl -sS -f -X POST "$HOOK_URL"

      - name: Trigger production deploy hook
        if: github.ref == 'refs/heads/main'
        env:
          HOOK_URL: ${{ secrets.VERCEL_DEPLOY_HOOK_PROD }}
        run: |
          if [ -z "$HOOK_URL" ]; then
            echo "::error::VERCEL_DEPLOY_HOOK_PROD is required but not set"
            exit 1
          fi
          curl -sS -f -X POST "$HOOK_URL"
