  <g font-family="'Public Sans', 'Helvetica Neue', Helvetica, Arial, sans-serif">
    <text x="64" y="96" font-size="24" font-weight="700" fill="#edf1f7">CapitolAlpha</text>
    <text x="64" y="206" font-size="68" font-weight="700" letter-spacing="-2.2" fill="#edf1f7">Do members of</text>
    <text x="64" y="278" font-size="68" font-weight="700" letter-spacing="-2.2" fill="#edf1f7">Congress beat</text>
    <text x="64" y="350" font-size="68" font-weight="700" letter-spacing="-2.2" fill="#edf1f7">the market? <tspan fill="#7b93ff">No.</tspan></text>
    <text x="64" y="420" font-size="22" fill="#9aa5ba">4,456 purchases, 2020 to 2025. Copying them</text>
    <text x="64" y="452" font-size="22" fill="#9aa5ba">after disclosure earned no four-factor alpha.</text>
    <text x="840" y="596" font-size="16" fill="#9aa5ba">Spread across purchases, days 0 to 125;</text>
    <text x="840" y="618" font-size="16" fill="#9aa5ba">the blue line is their average</text>
  </g>
