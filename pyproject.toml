[project]
name = "capitol-alpha"
version = "0.1.0"
description = "Congressional trading & financial analysis pipeline."
requires-python = ">=3.12"
dependencies = [
    "requests>=2.34.2",
    "pandas>=3.0.3",
    "pyyaml>=6.0.3",
    "pdfplumber>=0.11.10",
    "yfinance>=1.5.2",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=6.0.0",
    "playwright==1.62.0",
    "ruff",
]

[tool.uv]
package = false
default-groups = []

[tool.setuptools]
py-modules = []

[tool.pytest.ini_options]
addopts = "--cov=pipeline --cov-report=term-missing --cov-fail-under=100"
filterwarnings = [
    "error",
    "ignore::RuntimeWarning",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
]

[tool.ruff]
target-version = "py312"
src = ["pipeline", "tests", "run_pipeline.py"]
line-length = 100

[tool.ruff.lint]
select = [
    "E9",
    "F63",
    "F7",
    "F82",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
